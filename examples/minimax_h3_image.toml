# MiniMax-H3-Image (MiniMaxAI, 33B DiT, text to image and editing): a LoRA.
# The transformer is read from any of its layouts: ComfyUI's single file (Comfy-Org/MiniMax-H3-Image), the official
# repository (MiniMaxAI/MiniMax-H3-Image: transformer/ and pdd_fused_heads.safetensors) or its diffusers folder
# (transformer_diffusers/). The VAE and the text encoder likewise (ComfyUI's files, vae/ or vae_diffusers/,
# the text_encoder/ shards).
#
# One GPU:
#   deepspeed --num_gpus=1 train.py --deepspeed --config examples/minimax_h3_image.toml
# One node, 8 GPUs:
#   deepspeed --num_gpus=8 train.py --deepspeed --config examples/minimax_h3_image.toml
# Several nodes: README "Multi-node training".

output_dir = '/data/training_runs/minimax_h3_image'
dataset = 'examples/minimax_h3_image_dataset.toml'

epochs = 100
micro_batch_size_per_gpu = 1
pipeline_stages = 1
gradient_accumulation_steps = 4
gradient_clipping = 1.0
warmup_steps = 50

eval_every_n_epochs = 1
eval_before_first_step = true
eval_micro_batch_size_per_gpu = 1

save_every_n_epochs = 1
checkpoint_every_n_minutes = 120
keep_last_n_checkpoints = 3
save_dtype = 'bfloat16'

activation_checkpointing = true
# At most the number of blocks minus 2; lowers VRAM at some speed cost.
#blocks_to_swap = 20
caching_batch_size = 1
steps_per_print = 1

[model]
type = 'minimax_h3_image'
# A file, a shard index (.json), a folder of shards, or the repository root.
diffusion_model = '/data/models/MiniMax-H3-Image'
# Normally detected: 'comfy', 'official' or 'diffusers'.
#diffusion_model_format = 'official'
# The official layout's six PDD output heads, when pdd_fused_heads.safetensors is not at the repository root.
#pdd_heads = '/data/models/pdd_fused_heads.safetensors'
# vae/ (or vae_diffusers/) of the repository, or ComfyUI's VAE file. No audio_vae: images only.
vae = '/data/models/MiniMax-H3-Image/vae'
# Qwen3-VL-32B cut to its first 50 layers: ComfyUI's file, or the text_encoder/ shards of the repository.
text_encoders = [
    {path = '/data/models/MiniMax-H3-Image/text_encoder', type = 'minimax'}
]
dtype = 'bfloat16'
# 'pdd_grid' trains on the six sigmas the 6-step sampler runs (the checkpoint's pdd_config.json grid), each through its own
# output head, and nothing in between: the model only ever runs at those noise levels. It needs the PDD bank (the ComfyUI
# file, or pdd_fused_heads.safetensors with the official transformer/) and replaces shift. 'logit_normal' and 'uniform'
# draw any noise level and are shifted by `shift` (default 3: the checkpoint's grid is shift 3 applied to a base grid
# symmetric about 1/2; not a measured training optimum, try 1 to 3).
timestep_sample_method = 'pdd_grid'
#shift = 3
# The model is distilled into six output heads. Head 0 is the trainable weight and every other head is head 0 plus a fixed
# offset, so a full fine-tune moves all six; a LoRA leaves them alone. With logit_normal / uniform a sample trains through
# the head of the sampling interval its noise level falls in (as sampling applies it); 0 trains through head 0 alone.
# The previews run the six heads.
#train_pdd_head = 'sigma'
# The model is step- and guidance-distilled: training it without care erodes the 6-step sampling. ostris's training adapter,
# merged before training (not saved with the LoRA), keeps it; the LoRA is then used on the plain model. Its H3-Image file
# is in ComfyUI's layout, rank 16 on the blocks and the token refiner:
# https://huggingface.co/ostris/minimax_h3_training_adapter (minimax_h3_image_training_adapter_v1.safetensors)
#merge_adapters = ['/data/models/minimax_h3_image_training_adapter_v1.safetensors']
# cfg (CFG-augmented training) and audio_vae are refused.
# Per-component learning rates (a LoRA leaves the heads and projections frozen: head_lr, patch_embed_lr and
# text_projection_lr are refused with [adapter]; 0 freezes a component of a full fine-tune):
#blocks_lr = 1e-5
#token_refiner_lr = 1e-5

[adapter]
type = 'lora'
rank = 32
dtype = 'bfloat16'

[optimizer]
type = 'adamw_optimi'
lr = 1e-4
betas = [0.9, 0.99]
weight_decay = 0.01
eps = 1e-8
