# P-H3-Image (PrunaAI, a MiniMax H3 fine-tune for text to image and editing): a LoRA.
# Weights in ComfyUI format: https://huggingface.co/PrunaAI/P-H3-Image-Comfy
#
# One GPU:
#   deepspeed --num_gpus=1 train.py --deepspeed --config examples/p_h3_image.toml
# One node, 8 GPUs:
#   deepspeed --num_gpus=8 train.py --deepspeed --config examples/p_h3_image.toml
# Several nodes: README "Multi-node training".

output_dir = '/data/training_runs/p_h3_image'
dataset = 'examples/p_h3_image_dataset.toml'

epochs = 100
micro_batch_size_per_gpu = 1
pipeline_stages = 1
gradient_accumulation_steps = 4
gradient_clipping = 1.0
warmup_steps = 50

eval_every_n_epochs = 1
eval_before_first_step = true
eval_micro_batch_size_per_gpu = 1

save_every_n_epochs = 1
checkpoint_every_n_minutes = 120
keep_last_n_checkpoints = 3
save_dtype = 'bfloat16'

activation_checkpointing = true
# At most the number of blocks minus 2; lowers VRAM at some speed cost.
#blocks_to_swap = 20
caching_batch_size = 1
steps_per_print = 1

[model]
type = 'p_h3_image'
diffusion_model = '/data/models/P-H3-Image-Comfy/diffusion_models/p-h3-image_int8_convrot.safetensors'
# The P-H3-Image VAE (the MiniMax H3 video VAE is refused). No audio_vae: images only.
vae = '/data/models/P-H3-Image-Comfy/vae/p-h3-image_vae_bf16.safetensors'
# Qwen3-VL-4B with P-H3-Image's text connector, loaded as ComfyUI loads it (type 'minimax').
text_encoders = [
    {path = '/data/models/P-H3-Image-Comfy/text_encoders/p-h3-image_text_encoder_bf16.safetensors', type = 'minimax'}
]
dtype = 'bfloat16'
timestep_sample_method = 'logit_normal'
# The checkpoint samples 8 steps at sigmas from 1.0 down to 0.53 and then 0; most of them sit near
# pure noise, so training is shifted the same way. ai-toolkit trains P-H3-Image with shift 12.
shift = 12
# P-H3-Image is step- and guidance-distilled: training on it without care erodes the 8-step
# sampling. ostris's training adapter, merged before training (not saved with the LoRA), keeps
# it; the LoRA is then used on the plain model:
# https://huggingface.co/ostris/minimax_h3_training_adapter (p_h3_image_training_adapter_v1.safetensors)
#merge_adapters = ['/data/models/p_h3_image_training_adapter_v1.safetensors']
# "Edit <Picture 1>. " in front of edit captions, as ComfyUI does (default true).
#edit_prompt_prefix = true
# cfg (CFG-augmented training) and audio_vae of MiniMax H3 are refused.

[adapter]
type = 'lora'
rank = 32
dtype = 'bfloat16'

[optimizer]
type = 'adamw_optimi'
lr = 1e-4
betas = [0.9, 0.99]
weight_decay = 0.01
eps = 1e-8
