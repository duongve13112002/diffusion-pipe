# MOSS-Image full fine-tune on a large dataset (about 10M images) on 8 x H200 in bfloat16, with the healing terms
# of examples/moss_image/moss_image_heal.toml running for the whole run and the distillation toward the starting
# model fading out, so that it anchors the start of the run without capping what the new data teaches.
#   deepspeed --num_gpus=8 train.py --deepspeed --config examples/moss_image/moss_image_heal_10m_8xh200.toml
#
# Which weights it starts from is `diffusers_path`: MOSS-Image-Base or -SFT (or a save of your own). The
# distillation teacher is whatever those weights are. bfloat16 has the range of float32, so the Base and SFT
# stream peaks (~62k) are no problem here and no fold is needed (compute_dtype / fp16_fix are for float16).
#
# Nothing in this file has been tuned on a 5B model; the numbers are the MOSS-Image-heal card's (lr 1e-5, 64 images
# per step, write 5e-3 / target 0.5, rms 5e-5, outlier decay rate 12 with the cap falling 64 -> 16) except where
# marked "differs". A toy run (tiny MOSS model, one seed) showed: the outlier decay and the rms term cost almost
# nothing in how fast new data is learned; the distillation weight trades drift from the starting model for
# learning speed (0.3 learned about as fast as no teacher, 1.0 about 14% slower there). Watch train/flow_loss
# against train/distill_loss, train/stream_rms, train/write_share_*, train/outlier_over and train/outlier_max.
#
# Memory: one pipeline stage means every GPU holds the whole model: bf16 weights and gradients (~20 GB), the optimizer
# state, the frozen teacher copy (~10 GB) and the Qwen3.5-9B text encoder (~18 GB, captions are encoded on the fly),
# which should fit 141 GB with activation checkpointing (not measured here); lower micro_batch_size_per_gpu if it does not.
output_dir = '/pvc/runs/moss_image_heal_10m'
dataset = 'examples/moss_image/moss_image_dataset.toml'

# One pass over ~10M images at 64 per step is ~156k steps; set epochs to the number of passes you want. The
# schedules below (lr cosine, teacher fade, cap anneal) count steps: rescale them if you change the length.
epochs = 1
# 8 GPUs x 4 x 2 = 64 images per step, the card's batch (differs: the card used 4 GPUs x 4 x 4).
micro_batch_size_per_gpu = 4
pipeline_stages = 1
gradient_accumulation_steps = 2
gradient_clipping = 1.0
warmup_steps = 500
lr_scheduler = 'cosine'
# Cosine from 1e-5 to 1e-7.
lr_scheduler_min_ratio = 0.01

skip_nonfinite_steps = true

eval_every_n_steps = 1000
eval_before_first_step = true
eval_micro_batch_size_per_gpu = 1
eval_gradient_accumulation_steps = 1

save_every_n_steps = 10000
checkpoint_every_n_minutes = 60
keep_last_n_checkpoints = 3
activation_checkpointing = true
save_dtype = 'bfloat16'
caching_batch_size = 4
steps_per_print = 10

[model]
type = 'moss_image'
diffusers_path = '/pvc/models/MOSS-Image-Base'
dtype = 'bfloat16'
# The card's precision: float32 master weights (20 GB for the 5B model, and float32 optimizer state) computed in
# float16 with a dynamic loss scale. From the Base weights it also needs fp16_fix = 'online'.
#dtype = 'float32'
#compute_dtype = 'float16'
#fp16_fix = 'online'
timestep_sample_method = 'logit_normal'
# differs: the card froze the text refiner (text_embedder) to keep the text interface at its base values. With
# 10M captions of new concepts it can learn them too, so it trains here; uncomment to freeze it as the card did.
#text_refiner_lr = 0

# The stream penalties tap every block and need compile = false (the default) and, with
# activation_checkpointing, keep a small per-sublayer vector, not the activations.
[model.stream_loss.write]
weight = 5e-3
target = 0.5
anneal = 2000

[model.stream_loss.rms]
weight = 5e-5

# Distillation toward the frozen starting model. The starting weights are the teacher, so a run that starts from a
# previous save distills toward the file named in diffusers_path / transformer_path, not toward that save.
# The teacher forward adds about a quarter of a checkpointed step. differs: the card keeps weight 1.0 for the
# whole run; here it starts at 0.5 and falls along a cosine to 0 at step 100000, so the last third of the run
# learns freely while the stream terms and the outlier decay keep holding the weights and the stream in shape.
# For a run that must stay close to the starting model use decay = 'none' (weight 1.0 is the card's).
[teacher]
loss_weight = 0.5
decay = 'cosine'
decay_steps = 100000

# Rate scales with 1/lr: KohakuMoss's notes use 6 at lr 2e-5 (a time constant of ~8.3k steps) and ~12 at 1e-5.
# differs: the cap falls over 20k steps instead of the card's 10k, in a run three times longer.
# `exclude = '^(time_embedding|shared_block_modulation|video_head_modulation)\.'` leaves the conditioning to the
# task if train/outlier_over at step 1 shows those tensors dominate.
[outlier_decay]
rate = 12.0
cap = 16.0
cap_start = 64.0
cap_anneal = 20000
warmup = 1000

[optimizer]
type = 'adamw_optimi'
lr = 1e-5
betas = [0.9, 0.95]
weight_decay = 0.01
eps = 1e-8

[monitoring]
enable_wandb = false
