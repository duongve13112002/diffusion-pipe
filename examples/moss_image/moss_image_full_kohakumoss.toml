# MOSS-Image full fine-tune with the settings of KohakuMossTrainer's full fine-tune recipe
# (configs/moss/_base/base_full.py and algo_full.py), on 8 H200s: 2 pipeline stages x 4 data-parallel
# replicas. See docs/supported_models.md#moss-image and
# docs/note/kohakumoss-port-plan-and-recommended-configs.md for where each number comes from.
#   deepspeed --num_gpus=8 train.py --deepspeed --config examples/moss_image/moss_image_full_kohakumoss.toml
#
# What is KohakuMoss's here: Muon for the 2D weights and Adam for the rest at lr 5e-5, weight decay 0.01
# (none on 1D tensors, and the last block's q/k norm decays toward 1), cosine to 10% of the lr after 500
# warmup steps, EMA 0.9999, gradient clipping 1.0, the report's noise distribution, caption dropout 0.1
# (the dataset file). This is the base_full.py / algo_full.py setting (Muon, EMA 0.9999); the 5090 and other
# runnable recipes in KohakuMoss's configs/moss/recipes use AdamW without EMA.
# What differs: the engine (a pipeline-parallel DeepSpeed run, not FSDP); the batch (2 x 4 x 4 = 32 images per
# step here, against 294,912 tokens per step in KohakuMoss's 5090 full fine-tune, 36,864 x 8); Muon (see the
# optimizer note); and the decay rule: KohakuMoss also exempts the 2D video_embedder, text_embedder.proj and
# time_embedding weights from decay, while diffusion-pipe decays every 2D weight except llm_adapter.embed.
# Paths are on a network volume (/pvc), as in examples/moss_image/moss_image_k8s_job.yaml.
# Checkpoints and saves are written under a temporary name and renamed into place, so a pod
# killed mid-save leaves the previous ones intact; resume with --resume_from_checkpoint.
#
# Saves are diffusers transformer directories (config.json + diffusion_pytorch_model.safetensors):
# a transformer_path for this trainer, a diffusers MOSSImageTransformer, and a diffusion model for
# ComfyUI's Load Diffusion Model node (its diffusion_pytorch_model.safetensors).
output_dir = '/pvc/runs/moss_image_full_kohakumoss'
dataset = 'examples/moss_image/moss_image_dataset.toml'

epochs = 10
micro_batch_size_per_gpu = 2
# MOSS-Image is 42 blocks (~5B parameters). Two stages leave ample room on H200s for bf16
# weights, gradients and optimizer states; with pipeline_stages = 8 every GPU holds ~1/8.
pipeline_stages = 2
gradient_accumulation_steps = 4
gradient_clipping = 1.0
warmup_steps = 500
lr_scheduler = 'cosine'
# End the cosine at 10% of each group's own lr (after the warmup, on the last step) instead of the default
# floor of 1e-6.
lr_scheduler_min_ratio = 0.1
# The weights' exponential moving average, saved next to the weights (ema/).
ema_decay = 0.9999

# Drop an optimizer step whose gradient has a NaN or inf instead of letting it put NaN into the weights;
# the run stops after nonfinite_patience skipped steps in a row. The first check on a bf16 run that
# "suddenly went black" is whether this counter (train/nonfinite_skipped) moved.
skip_nonfinite_steps = true
#nonfinite_patience = 8

# Weight decay toward the weights the run started from instead of toward 0: a pretrained weight is not
# pulled to zero, only away from where it began. KohakuMoss's WD_TARGET = "start"; its default is "zero",
# so this is off here. Works with adamw, adamw_optimi, stableadamw, adamw8bit and genericoptim.
#weight_decay_target = 'start'
# KohakuMoss's WD_RULES = "moss": the last block's q and k norm gains decay toward 1. The regex is
# matched against parameter names (block 41 is the last of MOSS-Image's 42).
weight_decay_to_one = '^layers\.41\.(q_norm|k_norm)\.weight$'

eval_every_n_steps = 500
eval_before_first_step = true
eval_micro_batch_size_per_gpu = 1
eval_gradient_accumulation_steps = 1

save_every_n_steps = 1000
checkpoint_every_n_minutes = 60
# Older checkpoints of each kind are deleted as new ones land; at least 2 (a torn newest one
# must leave something to resume from).
keep_last_n_checkpoints = 3
activation_checkpointing = true
partition_method = 'parameters'
# The on-the-fly text encoder (~18 GB) is loaded on every GPU of stage 0 (ranks 0-3 here) and
# has no trainable parameters, so 'parameters' does not count it: stage 0's GPUs hold ~18 GB more
# than stage 1's. On H200s that fits. If stage 0 runs out of memory, move blocks to stage 1 by
# hand. The layers are the text encoder layer (there cached or not), the input layer, the 42
# blocks and the output layer (45); 'parameters' splits at [22] (blocks 0-19 on stage 0), and
# each block moved frees ~1 GB of weights, gradients and optimizer state plus its activations.
# [18] puts blocks 0-15 on stage 0 and blocks 16-41 on stage 1.
#partition_method = 'manual'
#partition_split = [18]
save_dtype = 'bfloat16'
caching_batch_size = 4
steps_per_print = 10

[model]
type = 'moss_image'
# Base for broad fine-tunes; SFT (OpenMOSS-Team/MOSS-Image-SFT) to start from the
# instruction-tuned model.
diffusers_path = '/pvc/models/MOSS-Image-Base'
# A previous full fine-tune's save works as the transformer; the rest still comes from diffusers_path.
#transformer_path = '/pvc/runs/moss_image_full/<run>/step5000'
dtype = 'bfloat16'
# Precision the VAE encodes the training images in: 'float16' (default), 'bfloat16' (cannot
# overflow, a little less exact) or 'float32' (the reference pipeline's). An image that overflows
# float16 is encoded again in bfloat16, then float32, with a warning. Changing it re-encodes the
# latent cache; caches from before this option were encoded in float32 and are kept with 'float32'.
# See docs/supported_models.md#moss-image.
#vae_dtype = 'float16'
# Captions are encoded on the fly by default: only latents are cached and the Qwen3.5-9B text
# encoder stays on stage 0's GPUs. true caches the embeddings once (~8 KB per token) instead.
#cache_text_embeddings = false
# With cache_text_embeddings = true: the dtype the embeddings are cached in. 'float8' (e4m3, a scale
# per token) halves the ~8 KB per token of bfloat16, each value off by ~2%; 'bfloat16', 'float16' or
# 'float32' work too. Read back in the encoder's own dtype. Changing it rebuilds that cache only.
#text_embedding_dtype = 'float8'
# Layout (JSON) captions with boxes normalized to 0..1000 (the technical report's form): 'as_written'
# keeps them in 0..1000 per bucket; 'abs_centralized' converts them to centred pixel boxes, the form
# the USERGUIDE recommends. Centred captions are left as they are either way.
#layout_bbox_space = 'as_written'
timestep_sample_method = 'logit_normal'
# Learning rates per part of the model (default: [optimizer] lr; 0 freezes the part):
#attn_lr = 1e-5           # q, k, v, o and q_norm/k_norm of the 42 blocks
#ffn_lr = 1e-5            # ffn_up_gate, ffn_down
#norm_lr = 5e-6           # the blocks' norm1/norm2
#text_refiner_lr = 5e-6   # text_embedder: the text refiner in front of the blocks
#modulation_lr = 5e-6     # time_embedding, shared_block_modulation, video_head_modulation
#embed_head_lr = 5e-6     # video_embedder, final_norm_video, final_linear_video
# ...and per block, multiplying its part's rate (ranges are inclusive and may not overlap):
#block_lr_scale = [{blocks = '0-9', scale = 0.5}, {blocks = '35-41', scale = 1.5}]

# Residual-stream penalties and outlier decay (off by default; see docs/supported_models.md#moss-image).
# Untuned: these are KohakuMossTrainer's values for a 10k-step full fine-tune.
#[model.stream_loss.write]
#weight = 5e-3
#target = 0.5
#anneal = 2000
#[model.stream_loss.rms]
#weight = 5e-5

# Muon for the 2D weights (orthogonalised updates scaled to AdamW's RMS, so the same lr range
# applies); 1D parameters and parameters without weight decay stay on Adam. KohakuMoss: lr 5e-5.
# KohakuMoss's Adam betas are (0.9, 0.95). Its Muon differs in detail: Nesterov momentum 0.95, the fused
# ffn_up_gate split in two, some tensors kept off Muon. Only the 0.2 * sqrt(max(rows, cols)) scale, the
# Newton-Schulz coefficients and 5 iterations match, so treat the lr as a starting point.
[optimizer]
type = 'genericoptim'
lr = 5e-5
betas = [0.9, 0.95]
weight_decay = 0.01
eps = 1e-8
muon = true

# AdamW instead (what moss_image_full_8gpu.toml uses, at 1e-5):
#[optimizer]
#type = 'adamw_optimi'
#lr = 1e-5
#betas = [0.9, 0.95]
#weight_decay = 0.01
#eps = 1e-8

[monitoring]
enable_wandb = false

# Distillation toward the model the run started from (off by default; not in KohakuMoss's recipe):
# loss = data loss + lambda * loss(prediction, the starting model's prediction). The starting model is a
# frozen copy kept on the GPU of every rank of the first pipeline stage (about the size of the model, 10 GB
# in bfloat16) and run once per micro-batch. decay = 'none' holds the model near its start for the whole run.
#[teacher]
#loss_weight = 0.5
#decay = 'linear'
#decay_steps = 8000

# Pulls weight outliers back towards each tensor's starting RMS after every step (full fine-tune only).
#[outlier_decay]
#rate = 6.0
#cap = 16.0
#cap_start = 64.0
#cap_anneal = 10000
#warmup = 1000
