# Iris-3B (speridlabs/iris-3b) LoRA training. See docs/supported_models.md#iris-3b for every option.
output_dir = '/data/diffusion_pipe_training_runs/iris_3b_lora'
dataset = 'examples/iris/iris_3b_dataset.toml'

epochs = 100
micro_batch_size_per_gpu = 1
pipeline_stages = 1
gradient_accumulation_steps = 4
gradient_clipping = 1.0
warmup_steps = 100

eval_every_n_epochs = 1
eval_before_first_step = true
eval_micro_batch_size_per_gpu = 1
eval_gradient_accumulation_steps = 1

save_every_n_epochs = 5
checkpoint_every_n_minutes = 120
activation_checkpointing = true
partition_method = 'parameters'
save_dtype = 'bfloat16'
caching_batch_size = 1
steps_per_print = 1
# Iris reads images (and, by default, encodes captions) inside the training loop. With the
# default on-the-fly pixels, more DataLoader workers hide the image decode/resize time.
dataloader_workers = 4
# Swap trunk blocks to CPU to fit on smaller GPUs (LoRA/LoKr only; dual-stream and
# single-stream blocks are swapped separately). Works with on-the-fly text encoding.
#blocks_to_swap = 8

[model]
type = 'iris'
# A local directory with model.safetensors + config.yaml, a single .safetensors file, or a
# Hugging Face repo id.
transformer_path = 'speridlabs/iris-3b'
# Defaults to the text_encoder.pretrained of the checkpoint's config.yaml (Qwen/Qwen3-VL-4B-Instruct).
# Also accepts a Transformers directory or a single .safetensors file:
#text_encoder_path = '/data/models/Qwen3-VL-4B-Instruct'
#text_encoder_path = '/data/models/qwen3_vl_4b.safetensors'
# Config + tokenizer for a single-file text encoder. Defaults to the bundled copy.
#text_encoder_config_path = 'configs/qwen3_vl_4b_instruct'
dtype = 'bfloat16'
# Pixels are read and resized on the fly (default). Set true to cache them as uint8 instead.
#cache_pixels = false
# Text is encoded on the fly every step (default). Set true to cache the Qwen3-VL states once;
# note each token stores 12 layers x 2560 values, so the cache is large.
#cache_text_embeddings = false
# Flow-matching timestep sampling, defaults match Iris's own training.
timestep_sample_method = 'logit_normal'
#shift = 4.0            # default: flow.shift from the checkpoint config
#shift_law = 'none'     # none | sd3 | flux (resolution-dependent shift)
#attn_backend = 'sdpa'  # sdpa | torch_flash | torch_cudnn | fa3 | fa4

[adapter]
type = 'lora'
rank = 32
dtype = 'bfloat16'
# OPLoRA (orthogonal-projection LoRA) works too:
#oplora = true
#oplora_rank = 16

# LoKr instead of LoRA:
#[adapter]
#type = 'lokr'
#rank = 16
#decompose_factor = 8
#dtype = 'bfloat16'

[optimizer]
type = 'adamw_optimi'
lr = 1e-4
betas = [0.9, 0.99]
weight_decay = 0.01
eps = 1e-8

[monitoring]
enable_wandb = false
