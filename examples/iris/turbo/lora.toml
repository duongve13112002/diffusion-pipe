# Iris-3B Turbo as a LoRA: distill your Iris model into a 4-step adapter on one GPU or several.
#
#   one GPU:   python tools/iris_turbo_lora.py --config examples/iris/turbo/lora.toml
#   N GPUs:    torchrun --standalone --nproc_per_node=N tools/iris_turbo_lora.py --config examples/iris/turbo/lora.toml
#
# Run the same command again after any interruption: it continues from the newest checkpoint in
# output_dir, and a finished run exits at once. Any key can be overridden with --set key=value.
# Guide: docs/iris_turbo.md ("Turbo as a LoRA").

# The model to distill: a full fine-tune save dir (its ema/ with EMA), a LoRA merged with
# tools/iris_merge_adapter.py, a local `hf download speridlabs/iris-3b`, or the repo id itself.
# The resulting adapter only works on this exact model.
teacher = '/data/iris_full/my-run/epoch6/ema'
# One prompt per line; build it from your captions with tools/iris_turbo_prompts.py, ideally
# mixed with general prompts (--extra-prompts). Do not change it during a run.
prompts_file = '/data/turbo_lora/prompts.txt'
output_dir = '/data/turbo_lora/run1'

# The student's schedule: the noise levels its 4 steps start at (Iris's released Turbo schedule).
sigmas = [1.0, 0.938, 0.833, 0.625]
cfg_scale = 3.5          # the teacher's guidance, baked into the student; use the CFG your model samples best at
# About one megapixel, one bucket drawn per micro-batch. Below ~1 MP Iris shows 16 px block
# artifacts that a student would learn.
resolutions = [[1024, 1024], [752, 1344], [896, 1344], [896, 1200], [1200, 896], [1344, 896], [1344, 752]]

# Global batch = batch_size x gradient_accumulation_steps x GPUs. 1 on one GPU works (a single
# GPU community run used 1); more GPUs give a less noisy update at the same learning rate.
batch_size = 1
gradient_accumulation_steps = 1
max_steps = 2000         # student updates
fake_updates = 2         # fake-network updates per student update
# Starting points, not tuned at scale. Iris's full-model recipe uses a fake rate 5x the student's;
# a community DMD2 LoRA collapsed to texture at 5e-5 and was stable at 2.5e-5. If previews lose
# contrast or turn to texture, go back to an earlier adapter and lower learning_rate.
learning_rate = 2e-5
fake_learning_rate = 1e-4
betas = [0.0, 0.999]
max_grad_norm = 1.0
ema_decay = 0.99         # the exported adapter is this EMA of the student

base_dtype = 'bfloat16'  # the frozen base (6 GB); 'float32' doubles it (12 GB)
activation_checkpointing = 'full'
# 'gpu' keeps the text encoder (Qwen3-VL-4B, ~8 GB) on the GPU. 'offload' keeps it in CPU memory
# and moves it over once per update: ~8 GB less GPU memory, a second or two slower per update.
text_encoder = 'gpu'

save_every = 100         # an adapter in adapters/step_N and a training checkpoint (~3 GB at rank 64)
keep_last = 2            # training checkpoints kept; every exported adapter is kept
save_dtype = 'bfloat16'
log_every = 10

# Previews with the EMA student, every sample_every updates, in samples/step_N. Watch these: a
# distillation's losses do not show quality.
sample_every = 100
sample_size = [1024, 1024]
sample_prompts = [
    'a red fox sleeping in fresh snow, golden hour',
    'a bowl of ramen on a wooden table, steam rising, close-up photograph',
    'a lighthouse on a cliff at night under the milky way',
    'portrait of an old fisherman with a grey beard, overcast light',
]

[adapter]
rank = 64
alpha = 64
fake_rank = 64
fake_alpha = 64
# Every linear layer but the text adapter. Entries are IrisDiT class names or top-level modules.
target_modules = ['s_embedder', 't_embedder', 'modulation_cores', 'MMDiTBlock', 'SingleStreamBlock',
                  'pixel_embedder', 'PiTBlock', 'final_layer']
